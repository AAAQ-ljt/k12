server:
  port: 8084
  main:
    web-application-type: reactive
spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  datasource:
    url: jdbc:mysql://localhost:3306/easymall?allowMultiQueries=true&useSSL=false&serverTimezone=GMT%2B8&characterEncoding=utf8
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  task:
    scheduling:
      pool:
        size: 5
  data:
    redis:
      host: 127.0.0.1
      port: 6379
  ai:
    # MCP 服务
    mcp:
      server:
        protocol: STREAMABLE # STREAMABLE STATELESS
        name: easymall-mcp  # 服务器名称
        version: 1.0.0
        streamable-http:
          mcp-endpoint: /mcp  #默认是mcp
          keep-alive-interval: 60s
mybatis:
  configuration:
    map-underscore-to-camel-case: true
#项目目录
project:
  folder: c:/webser/web_app/easymall/
#支付宝
alipay:
  appid: 9021000158635250   # 沙箱 9021000158635250
  # 应用私钥
  # 沙箱 
  appPrivateKey: 
  appCertPath: alipay-sandbox/appPublicCert.crt
  alipayPublicCertPath: alipay-sandbox/alipayPublicCert.crt
  alipayRootCertPath: alipay-sandbox/alipayRootCert.crt
  #沙箱 https://openapi-sandbox.dl.alipaydev.com/gateway.do  正式 https://openapi.alipay.com/gateway.do
  serverUrl: https://openapi-sandbox.dl.alipaydev.com/gateway.do