server:
  port: 6061
  servlet:
    context-path: /api
spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
    # 启用 form-urlencoded 请求体支持
    encoding: UTF-8
    load-parameters-directly: true
  datasource:
    url: jdbc:mysql://localhost:3306/nexora?allowMultiQueries=true&useSSL=false&serverTimezone=GMT%2B8&characterEncoding=utf8
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  task:
    scheduling:
      pool:
        size: 5
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 1
  elasticsearch:
    uris: http://localhost:9200
  mail:
    host: smtp.qq.com
    port: 465
    username: ${NEXORA_MAIL_USERNAME:1994616658@qq.com}
    password: ${NEXORA_MAIL_PASSWORD:your-auth-code}
    properties:
      mail:
        smtp:
          ssl:
            enable: true
          auth: true
          starttls:
            enable: true

# 管理端管理员账号（初始账号，首次登录后建议修改密码）
admin:
  account:
    username: admin
    password: e10adc3949ba59abbe56e057f20f883e  # MD5 加密的 "123456"
mybatis:
  mapper-locations: classpath*:/com/nexora/mappers/*.xml
  configuration:
    map-underscore-to-camel-case: true
#项目目录（按本机实际路径调整）
project:
  folder: d:/dev/ai/k12/nexora/
resource:
  temp-dir: resource/temp
  file-dir: resource/files
  upload-session-ttl-minutes: 120
  ffmpeg-path: ffmpeg

#日志级别
log:
  root:
    level: debug