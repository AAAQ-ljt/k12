server:
  port: 6060
  servlet:
    context-path: /api
ws:
  port: 6062
spring:
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB
  datasource:
    url: jdbc:mysql://localhost:3306/nexora?allowMultiQueries=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2B8&characterEncoding=utf8
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  task:
    scheduling:
      pool:
        size: 5
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 1
  elasticsearch:
    uris: http://localhost:9200
  mail:
    host: smtp.qq.com
    port: 465
    username: ${NEXORA_MAIL_USERNAME:1994616658@qq.com}
    password: ${NEXORA_MAIL_PASSWORD:your-auth-code}
    properties:
      mail:
        smtp:
          ssl:
            enable: true
          auth: true
          starttls:
            enable: true
  ai:
    model:
      chat: openai
      embedding: openai
    vectorstore:
      elasticsearch:
        initialize-schema: true
        index-name: nexora-index-vectorstore
        dimensions: 1024
    openai:
      api-key: ${NEXORA_DASHSCOPE_API_KEY:sk-xxx}   # 环境变量注入，禁止硬编码
      base-url: ${NEXORA_EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/}
      chat:
        api-key: ${NEXORA_DEEPSEEK_API_KEY:sk-xxx}
        base-url: ${NEXORA_CHAT_BASE_URL:https://api.deepseek.com}
        completions-path: ${NEXORA_CHAT_COMPLETIONS_PATH:/chat/completions}
        options:
          model: ${NEXORA_CHAT_MODEL:deepseek-v4-flash}
          reasoning-effort: high
      embedding:
        api-key: ${NEXORA_EMBEDDING_API_KEY:${NEXORA_DASHSCOPE_API_KEY:sk-xxx}}
        base-url: ${NEXORA_EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/}
        embeddings-path: ${NEXORA_EMBEDDINGS_PATH:/v1/embeddings}
        options:
          model: ${NEXORA_EMBEDDING_MODEL:qwen3.7-text-embedding}
          dimensions: ${NEXORA_EMBEDDING_DIMENSIONS:1024}
    mcp:
      client:
        enabled: ${NEXORA_MCP_CLIENT_ENABLED:false}
        # 不在启动时握手：MCP 服务（8084）未启动也不影响 web 启动，工具首次调用时才连接
        initialized: false
        name: nexora-mcp-client
        version: 1.0.0
        request-timeout: 30s
        type: SYNC
        streamable-http:
          connections:
            nexora-mcp:
              url: http://localhost:8084/mcp
# 登录 Token 派生密钥（与 admin 一致，生产环境建议通过环境变量覆盖）
login:
  token-secret: ${NEXORA_TOKEN_SECRET:nexora-default-token-secret}

mybatis:
  mapper-locations: classpath*:/com/nexora/mappers/*.xml
  configuration:
    map-underscore-to-camel-case: true
#项目目录（按本机实际路径调整）
project:
  ai:
    vision-model: ${NEXORA_VISION_MODEL:deepseek-v4-flash-vision-exp}
    image:
      provider: ${NEXORA_IMAGE_PROVIDER:ark}
      model: ${NEXORA_IMAGE_MODEL:qwen-image-3.0}
      base-url: ${NEXORA_IMAGE_BASE_URL:https://dashscope.aliyuncs.com}
      path: ${NEXORA_IMAGE_PATH:/api/v1/services/aigc/multimodal-generation/generation}
      api-key: ${NEXORA_IMAGE_API_KEY:${NEXORA_DASHSCOPE_API_KEY:sk-xxx}}
      prompt-extend: true
      ark-model: ${NEXORA_ARK_MODEL:doubao-seedream-5-0-pro-260628}
      ark-base-url: ${NEXORA_ARK_BASE_URL:https://ark.cn-beijing.volces.com/api/v3}
      ark-api-key: ${NEXORA_ARK_API_KEY:ark-xxx}
      gpt-model: ${NEXORA_GPT_IMAGE_MODEL:gpt-image-2}
      gpt-base-url: ${NEXORA_GPT_IMAGE_BASE_URL:https://img.zikl.dev}
      gpt-path: ${NEXORA_GPT_IMAGE_PATH:/v1/images/generations}
      gpt-api-key: ${NEXORA_GPT_IMAGE_API_KEY:sk-xxx}
      gpt-size: ${NEXORA_GPT_IMAGE_SIZE:1024x1024}
    tts:
      model: ${NEXORA_MIMO_TTS_MODEL:mimo-v2.5-tts}
      base-url: ${NEXORA_MIMO_TTS_BASE_URL:https://api.xiaomimimo.com/v1}
      path: ${NEXORA_MIMO_TTS_PATH:/chat/completions}
      api-key: ${NEXORA_MIMO_TTS_API_KEY:sk-xxx}
      format: ${NEXORA_MIMO_TTS_FORMAT:mp3}
      voice-primary-low: ${NEXORA_MIMO_TTS_VOICE_LOW:冰糖}
      voice-primary-high: ${NEXORA_MIMO_TTS_VOICE_HIGH:白桦}
      voice-default: ${NEXORA_MIMO_TTS_VOICE_DEFAULT:mimo_default}
      tone: 用温柔亲切的语气朗读，语速稍慢，适合讲给小朋友听
      timeout-seconds: 120
  folder: d:/dev/ai/k12/nexora/
resource:
  temp-dir: resource/temp
  file-dir: resource/files
  upload-session-ttl-minutes: 120
  student-quota-mb: 300
  ffmpeg-path: ffmpeg
  ffprobe-path: ffprobe

#日志级别
log:
  root:
    level: info
