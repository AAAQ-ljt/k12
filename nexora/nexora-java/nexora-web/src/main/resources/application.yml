server:
  port: 6060
  servlet:
    context-path: /api
ws:
  port: 6062
spring:
  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.elasticsearch.autoconfigure.ElasticsearchVectorStoreAutoConfiguration
      - org.springframework.ai.model.ollama.autoconfigure.OllamaEmbeddingAutoConfiguration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  datasource:
    url: jdbc:mysql://localhost:3306/nexora?allowMultiQueries=true&useSSL=false&serverTimezone=GMT%2B8&characterEncoding=utf8
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  task:
    scheduling:
      pool:
        size: 5
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 1
  elasticsearch:
    uris: http://localhost:9200
  mail:
    host: smtp.qq.com
    port: 465
    username: ${NEXORA_MAIL_USERNAME:1994616658@qq.com}
    password: ${NEXORA_MAIL_PASSWORD:your-auth-code}
    properties:
      mail:
        smtp:
          ssl:
            enable: true
          auth: true
          starttls:
            enable: true
  ai:
    vectorstore:
      elasticsearch:
        initialize-schema: true
        index-name: nexora-index-vectorstore
        dimensions: 1024
    openai:
      api-key: ${NEXORA_AI_API_KEY:sk-xxx}   # 环境变量注入，禁止硬编码
      base-url: https://dashscope.aliyuncs.com/compatible-mode/
      chat:
        completions-path: v1/chat/completions
        options:
          model: qwen3-32b
      embedding:
        options:
          model: text-embedding-v4
    mcp:
      client:
        enabled: true
        name: nexora-mcp-client
        version: 1.0.0
        request-timeout: 30s
        type: SYNC
        streamable-http:
          connections:
            nexora-mcp:
              url: http://localhost:8084
# 登录 Token 派生密钥（与 admin 一致，生产环境建议通过环境变量覆盖）
login:
  token-secret: ${NEXORA_TOKEN_SECRET:nexora-default-token-secret}

mybatis:
  mapper-locations: classpath*:/com/nexora/mappers/*.xml
  configuration:
    map-underscore-to-camel-case: true
#项目目录（按本机实际路径调整）
project:
  folder: d:/dev/ai/k12/nexora/

#日志级别
log:
  root:
    level: debug