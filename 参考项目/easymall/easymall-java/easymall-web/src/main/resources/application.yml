server:
  port: 6050
  servlet:
    context-path: /api
ws:
  port: 6051
spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  datasource:
    url: jdbc:mysql://localhost:3306/easymall?allowMultiQueries=true&useSSL=false&serverTimezone=GMT%2B8&characterEncoding=utf8
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  task:
    scheduling:
      pool:
        size: 5
  data:
    redis:
      host: 127.0.0.1
      port: 6379
  codec:
    default-charset: UTF-8
  #elasticsearch相关
  elasticsearch:
    uris: http://localhost:9200
    #username: elastic  # 如果启用了安全认证
    #password: your_password
  # AI相关
  ai:
    #向量数据库
    vectorstore:
      elasticsearch:
        initialize-schema: true
        index-name: easymall-index-vectorstore
        dimensions: 1024 #embeddinggemma:768  百炼 text-embedding-v4:1024  doubao-embedding-vision-251215:2048# 向量维度（根据使用的嵌入模型调整）
    # 使用openai 对接 阿里百炼(推荐大家使用这个,下面的otherai可以不用管,如果没有阿里百炼的,可以使用deepseek的chat模型(deepssek没向量模型)),豆包的向量模型)
    openai:
      api-key: sk-111111111111111111111111111111111  #这里填入自己的阿里百炼的appkey
      base-url: https://dashscope.aliyuncs.com/compatible-mode/
      chat:
        completions-path: v1/chat/completions
        options:
          model: qwen3-32b  #qwen3-max 使用max 调用mcp 报错toolName cannot be null
      embedding:
        options:
          model: text-embedding-v4
    #使用其他模型 比如 豆包的向量模型,如果大家使用的其他的chat模型，使用豆包的向量模型，就配置一下下面的豆包的appkey
    otherai:
      base-url: https://ark.cn-beijing.volces.com/api
      api-key: test1211212121212121212121212 #这里填入你的豆包的appkey
      embeddingsPath: /v3/embeddings/multimodal
      embedding:
        model: doubao-embedding-vision-251215 #豆包的向量模型
    # 对接本地ollama
    ollama:
      base-url: http://localhost:11434
      chat:
        model: qwen3:8b
      embedding:
        model: embeddinggemma:300m
    mcp:
      client:
        enabled: true
        name: my-mcp-client
        version: 1.0.0
        request-timeout: 30s
        type: SYNC  # or ASYNC for reactive applications
        streamable-http:
          connections:
            mcp-server:
              url: http://localhost:8084
mybatis:
  configuration:
    map-underscore-to-camel-case: true
#项目目录
project:
  folder: c:/webser/web_app/easymall/
  auto-checkpay: true #自动检查支付订单
  domain: http://xxx.xxxx.com
  #开启ai聊天轮数限制
  ai-chat-limit: 0
#支付宝
alipay:
  appid: 9021000158635250   # 沙箱 
  # 应用私钥
  # 沙箱 
  appPrivateKey: 
  appCertPath: alipay-sandbox/appPublicCert.crt
  alipayPublicCertPath: alipay-sandbox/alipayPublicCert.crt
  alipayRootCertPath: alipay-sandbox/alipayRootCert.crt
  #沙箱 https://openapi-sandbox.dl.alipaydev.com/gateway.do  正式 https://openapi.alipay.com/gateway.do
  serverUrl: https://openapi-sandbox.dl.alipaydev.com/gateway.do
#日志级别
log:
  root:
    level: debug