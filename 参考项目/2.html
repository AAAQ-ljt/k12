<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K12 AI教学助手 - 后台管理系统</title>
    <style>
        :root {
            --primary-color: #2563EB;
            --bg-body: #F8FAFC;
            --header-height: 60px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        body { background-color: var(--bg-body); color: #334155; }

        /* 顶部横向导航 */
        .top-nav {
            height: var(--header-height);
            background: #fff;
            border-bottom: 1px solid #E2E8F0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 100;
        }
        .logo { font-size: 18px; font-weight: 700; color: var(--primary-color); display: flex; align-items: center; gap: 8px; }
        .nav-links { display: flex; gap: 30px; height: 100%; }
        .nav-link { 
            display: flex; align-items: center; height: 100%; 
            color: #64748B; text-decoration: none; font-size: 14px; font-weight: 500;
            border-bottom: 2px solid transparent; transition: all 0.2s;
        }
        .nav-link:hover, .nav-link.active { color: var(--primary-color); border-bottom-color: var(--primary-color); }
        
        .admin-profile { display: flex; align-items: center; gap: 10px; font-size: 14px; }
        .admin-avatar { width: 32px; height: 32px; background: #E0E7FF; border-radius: 50%; }

        /* 主容器 */
        .container { max-width: 1200px; margin: calc(var(--header-height) + 30px) auto 40px; padding: 0 20px; }

        /* 页面标题 */
        .page-header { margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; }
        .page-title { font-size: 24px; font-weight: 600; color: #1E293B; }
        .btn-primary { background: var(--primary-color); color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; }

        /* 数据概览卡片 */
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: #fff; padding: 20px; border-radius: 8px; border: 1px solid #E2E8F0; }
        .stat-label { font-size: 13px; color: #64748B; margin-bottom: 8px; }
        .stat-value { font-size: 28px; font-weight: 700; color: #0F172A;
